<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --paper:#EDEAE3;
    --paper-deep:#E2DDD1;
    --card:#FFFFFF;
    --ink:#1A1918;
    --ink-soft:#5B584F;
    --ink-faint:#9A968A;
    --line:#D9D3C4;
    --accent:#B5482F;
    --accent-ink:#FFF6F1;
    --tag:#8A8368;
    --tag-soft:#EFE6CE;
    --ok:#3E6B4F;
    --radius:14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:'Inter',sans-serif; overscroll-behavior-y:contain;}
  body{
    background-image:
      radial-gradient(circle at 1px 1px, rgba(26,25,24,0.05) 1px, transparent 0);
    background-size: 16px 16px;
    min-height:100vh;
    padding-bottom: calc(96px + var(--safe-bottom));
  }
  header{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:calc(18px + env(safe-area-inset-top, 0px)) 18px 14px;
  }
  header::after{
    content:"";
    display:block;
    position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background: repeating-linear-gradient(90deg, var(--ink-faint) 0 6px, transparent 6px 12px);
    opacity:.4;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin-bottom:4px;
  }
  h1{
    font-family:'Archivo', sans-serif; font-weight:900;
    font-size:22px; letter-spacing:-0.01em; margin:0 0 14px;
  }
  .session-tabs{
    display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:2px 2px 10px; margin:0 -2px 4px;
    scrollbar-width:none;
  }
  .session-tabs::-webkit-scrollbar{display:none;}
  .session-tab{
    flex-shrink:0; display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    background:var(--card); border:1px solid var(--line); border-radius:11px;
    padding:8px 13px; cursor:pointer;
  }
  .session-tab .name{
    font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px; color:var(--ink);
    white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis;
  }
  .session-tab .date{
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-faint);
  }
  .session-tab.active{
    background:var(--ok); border-color:var(--ok);
  }
  .session-tab.active .name{color:#fff;}
  .session-tab.active .date{color:#DCEAE0;}
  .session-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .session-pill{
    font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:500;
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:7px 14px; color:var(--ink-soft); display:flex; align-items:center; gap:8px;
    max-width:70%;
  }
  .session-pill b{color:var(--ink); font-weight:700;}
  .session-btn{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    background:none; border:none; color:var(--accent); padding:8px 4px; cursor:pointer;
  }
  main{padding:16px;}
  .count-row{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:2px 4px 14px; color:var(--ink-faint); font-size:12px;
    font-family:'JetBrains Mono', monospace; letter-spacing:.05em;
  }
  .day-header{
    display:flex; align-items:center; gap:10px;
    margin:22px 4px 10px;
  }
  .day-header:first-child{margin-top:0;}
  .day-header .tab{
    font-family:'Archivo',sans-serif; font-weight:800; font-size:13px;
    background:var(--ink); color:var(--paper); padding:5px 12px 5px 10px;
    border-radius:0 6px 6px 0; text-transform:capitalize;
    position:relative;
  }
  .day-header .tab::before{
    content:""; position:absolute; left:-8px; top:0; border-style:solid;
    border-width:0 0 100% 8px; border-color:transparent transparent transparent var(--ink);
  }
  .day-header .n{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint);
  }
  .day-header .rule{flex:1; height:1px; background:var(--line);}
  .export-btn{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:7px 12px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;
    color:var(--ink-soft); display:flex; align-items:center; gap:5px; flex-shrink:0;
  }
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
  }
  .empty .stamp{
    display:inline-block; border:2px dashed var(--ink-faint); border-radius:50%;
    width:64px; height:64px; line-height:60px; font-size:26px; margin-bottom:14px;
  }

/* ---------- image compression ---------- */
function compressImage(file, maxDim=1100, quality=0.72){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* grijswaarden + wat extra contrast — kan tekstherkenning op een drukke
   achtergrond (bv. denim) iets helpen, geen garantie */
function preprocessForOCR(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const maxDim = 1800;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const contrast = 1.35;
      for(let i = 0; i < d.length; i += 4){
        const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        let v = (gray - 128) * contrast + 128;
        v = Math.max(0, Math.min(255, v));
        d[i] = d[i+1] = d[i+2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- materiaal-label OCR ---------- */
function parseMaterialPhotos(raw){
  const out = [null, null];
  if(!raw) return out;
  try{
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)){
      arr.slice(0,2).forEach((v,i) => out[i] = v);
      return out;
    }
  }catch(e){ /* niet-JSON: oud formaat met één losse foto */ }
  out[0] = raw;
  return out;
}

async function ensureSessionRecord(name){
  try{
    await sb.from('packshot_sessions').upsert({ session_id: name }, { onConflict: 'session_id', ignoreDuplicates: true });
  }catch(e){ console.error(e); }
}

async function fetchSessionMeta(){
  const [sessionsRes, itemsRes] = await Promise.all([
    sb.from('packshot_sessions').select('session_id, created_at'),
    sb.from(TABLE).select('session_id, created_at')
  ]);
  const map = {};
  (sessionsRes.data || []).forEach(r => {
    map[r.session_id] = { session_id: r.session_id, count: 0, earliest: r.created_at };
  });
  (itemsRes.data || []).forEach(r => {
    if(!map[r.session_id]) map[r.session_id] = { session_id: r.session_id, count: 0, earliest: r.created_at };
    map[r.session_id].count++;
  });
  return Object.values(map);
}

async function renderSessionTabs(){
  const meta = await fetchSessionMeta();
  if(currentSession && !meta.some(m => m.session_id === currentSession)){
    meta.push({ session_id: currentSession, count: items.length, earliest: new Date().toISOString() });
  }
  meta.sort((a,b)=> a.earliest.localeCompare(b.earliest));
  const box = document.getElementById('sessionTabs');
  if(meta.length === 0){ box.innerHTML = ''; return; }
  box.innerHTML = meta.map(m => `
    <div class="session-tab ${m.session_id === currentSession ? 'active':''}" data-session="${escapeAttr(m.session_id)}">
      <span class="name">${escapeHtml(displaySessionName(m.session_id))}</span>
      <span class="date">${new Date(m.earliest).toLocaleDateString('nl-BE', {day:'2-digit', month:'2-digit'})} · ${m.count} art.</span>
    </div>`).join('');
  box.querySelectorAll('.session-tab').forEach(el=>{
    el.addEventListener('click', ()=> setSession(el.dataset.session));
  });
  // scroll active tab into view
  const activeEl = box.querySelector('.session-tab.active');
  if(activeEl) activeEl.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

  document.getElementById('syncState').textContent = 'laden…';
  const { data, error } = await sb.from(TABLE)

    .eq('session_id', currentSession)
    .order('volgnummer', { ascending: true });
  if(error){ console.error(error); toast('Laden mislukt: ' + (error.message || error.hint || JSON.stringify(error))); document.getElementById('syncState').textContent=''; return; }
  items = data || [];
  document.getElementById('syncState').textContent = '';
  render();
  renderSessionTabs();
}

async function loadSessionList(){
  const meta = await fetchSessionMeta();
  meta.sort((a,b)=> b.earliest.localeCompare(a.earliest));
  const box = document.getElementById('sessionList');
  if(meta.length === 0){ box.innerHTML = '<div class="sub">Nog geen eerdere sessies</div>'; return; }
  box.innerHTML = meta.map(m => `
    <div class="session-item">
      <div class="info" data-session="${escapeAttr(m.session_id)}">
        <span>${escapeHtml(displaySessionName(m.session_id))}</span>
        <span class="n">${m.count} art. ›</span>
      </div>
      <button class="session-del-btn" data-session-del="${escapeAttr(m.session_id)}" data-count="${m.count}">🗑️</button>
    </div>`).join('');

  box.querySelectorAll('.info').forEach(el=>{
    el.addEventListener('click', ()=>{
      setSession(el.dataset.session);
      document.getElementById('sessionSheetBackdrop').classList.remove('open');
    });
  });

  box.querySelectorAll('[data-session-del]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const name = btn.dataset.sessionDel;
      const count = btn.dataset.count;
      const ok = await customConfirm(`Sessie "${displaySessionName(name)}" met ${count} artikel${count==1?'':'en'} volledig wissen? Dit kan niet ongedaan gemaakt worden.`);
      if(!ok) return;

      const { error } = await sb.from(TABLE).delete().eq('session_id', name);
      if(error){ toast('Wissen mislukt: ' + (error.message || JSON.stringify(error))); return; }
      await sb.from('packshot_sessions').delete().eq('session_id', name);

      toast('Sessie gewist');

      if(name === currentSession){
        currentSession = null;
        localStorage.removeItem('packshot_session');
        items = [];
        render();
      }
      loadSessionList();
      renderSessionTabs();
    });
  });
}

function setSession(name){
  currentSession = name;
  localStorage.setItem('packshot_session', name);
  document.getElementById('sessionName').textContent = displaySessionName(name);
  loadItems();
}

function dayKey(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dayLabel(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('nl-BE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function groupByDay(list){
  const groups = {};
  list.forEach(it=>{
    const k = dayKey(it.created_at);
    if(!groups[k]) groups[k] = { key:k, label: dayLabel(it.created_at), items: [] };
    groups[k].items.push(it);
  });
  return Object.values(groups).sort((a,b)=> a.key.localeCompare(b.key));
}

function nextVolgnummer(){
  if(items.length === 0) return 1;
  return Math.max(...items.map(i=>i.volgnummer)) + 1;
}

/* ---------- render ---------- */

  const list = document.getElementById('list');

  }
  if(items.length === 0){
    list.innerHTML = `<div class="empty"><div class="stamp">＋</div><p>Nog geen artikels in deze sessie. Tik op “Nieuw artikel” om te beginnen.</p></div>`;

  const groups = groupByDay(items);
  list.innerHTML = groups.map(g => `
    <div class="day-header">

            <div class="thumb-label">Label</div>

            <div class="thumb-label">Artikel</div>
          </div>
          <div style="flex:1"></div>
          <div class="card-actions">
            <button class="icon-btn" data-edit="${it.id}">✏️</button>
            <button class="icon-btn" data-del="${it.id}">🗑️</button>
          </div>
        </div>
        <div class="meta-row">
          <div style="flex:1">
            <span class="ref">${escapeHtml(it.referentie || '—')}</span>
            <div class="omschr">${escapeHtml(it.omschrijving || '')}</div>
            ${it.merk ? `<div class="merk">${escapeHtml(it.merk)}</div>` : ''}
            ${(it.foto_materiaal || it.materiaal_tekst) ? `
            <div class="material-chip">
              ${parseMaterialPhotos(it.foto_materiaal).filter(Boolean).length ? `
              <div class="mat-thumbs">
                ${parseMaterialPhotos(it.foto_materiaal).filter(Boolean).map(p => `<img class="mat-thumb" src="${p}">`).join('')}
              </div>` : ''}
              ${it.materiaal_tekst ? `
              <div class="mat-text-row">
                <span class="mat-text">${escapeHtml(it.materiaal_tekst)}</span>
                <button class="mat-copy" data-copy="${it.id}" title="Kopieer samenstelling">📋</button>
              </div>` : ''}
            </div>` : ''}
          </div>
        </div>
      </div>
    </div>
  `).join('')}
  `).join('');

  list.querySelectorAll('.thumb[data-item]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const it = items.find(i => i.id === img.dataset.item);
      if(it) openLightbox(it[img.dataset.field]);
    });
  });

  list.querySelectorAll('.mat-thumb').forEach(img=>{
    img.addEventListener('click', ()=> openLightbox(img.src));
  });

  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const it = items.find(i => i.id === btn.dataset.edit);
      if(it) openItemSheet(it);
    });
  });

  list.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const it = items.find(i => i.id === btn.dataset.copy);
      if(!it || !it.materiaal_tekst) return;
      try{
        await navigator.clipboard.writeText(it.materiaal_tekst);
        toast('Gekopieerd naar klembord');
      } catch(err){

      }
    });
  });

  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const ok = await customConfirm('Dit artikel verwijderen uit de lijst?');
      if(!ok) return;
      const id = btn.dataset.del;
      const { error } = await sb.from(TABLE).delete().eq('id', id);
      if(error){ toast('Verwijderen mislukt: ' + (error.message || JSON.stringify(error))); return; }
      items = items.filter(i => i.id !== id);

      toast('Verwijderd');
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

let editingItem = null;

function openItemSheet(item){
  editingItem = item || null;
  labelPhoto = item ? (item.foto_label || null) : null;
  artikelPhoto = item ? (item.foto_artikel || null) : null;

  const labelSlot = document.getElementById('labelSlot');
  const artikelSlot = document.getElementById('artikelSlot');

  if(labelPhoto){
    labelSlot.innerHTML = `<img src="${labelPhoto}"><div class="retake">opnieuw</div>`;
    labelSlot.classList.add('filled');
  } else {
    labelSlot.innerHTML = `<div class="cam-icon">🏷️</div><div class="cam-label">Label</div>`;
    labelSlot.classList.remove('filled');
  }
  if(artikelPhoto){
    artikelSlot.innerHTML = `<img src="${artikelPhoto}"><div class="retake">opnieuw</div>`;
    artikelSlot.classList.add('filled');
  } else {
    artikelSlot.innerHTML = `<div class="cam-icon">👕</div><div class="cam-label">Artikel</div>`;
    artikelSlot.classList.remove('filled');
  }

  materiaalPhotos = item ? parseMaterialPhotos(item.foto_materiaal) : [null, null];

    } else {

  document.getElementById('fRef').value = item ? (item.referentie || '') : '';

  document.getElementById('materiaalText').value = item ? (item.materiaal_tekst || '') : '';

  document.getElementById('newVolgnummer').textContent = `VOLGNR. ${String(item ? item.volgnummer : nextVolgnummer()).padStart(3,'0')}`;

function wireMaterialSlot(idx){
  const slot = document.getElementById(`materiaalSlot${idx}`);
  const input = document.getElementById(`materiaalInput${idx}`);

  slot.addEventListener('click', async (e)=>{
    if(slot.classList.contains('filled')){
      if(e.target.closest('.retake')){
        const ok = await customConfirm('Deze materiaalfoto vervangen door een nieuwe?');
        if(!ok) return;
        input.click();
      } else {
        openLightbox(materiaalPhotos[idx]);
      }
    } else {
      input.click();
    }
  });

  input.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    processingPhotoCount++;
    updateSaveButtonAvailability();
    toast('Foto verwerken…');
    try{
      // leesbare, lichte foto bewaren
      materiaalPhotos[idx] = await compressImage(file, 900, 0.6);
      slot.innerHTML = `<img src="${materiaalPhotos[idx]}"><div class="retake">opnieuw</div>`;
      slot.classList.add('filled');

      // tekst herkennen — exact overnemen zoals herkend, geen filtering.
      // Kan onnauwkeurig zijn bij drukke achtergronden of klein lettertype;
      // corrigeer/wis wat nodig is in het tekstvak hieronder.
      toast('Tekst herkennen…');
      const ocrSource = await preprocessForOCR(file);
      const { data: { text } } = await Tesseract.recognize(ocrSource, 'eng');
      const cleaned = text.replace(/\s+$/gm, '').trim();
      if(cleaned){
        const ta = document.getElementById('materiaalText');
        ta.value = ta.value.trim() ? (ta.value.trim() + '\n\n' + cleaned) : cleaned;
        toast('Tekst herkend — controleer en pas aan indien nodig');
      } else {
        toast('Geen tekst herkend in deze foto');
      }
    } catch(err){
      console.error(err);
      toast('Verwerken mislukt: ' + (err.message || 'onbekende fout'));
    } finally {
      processingPhotoCount = Math.max(0, processingPhotoCount - 1);
      updateSaveButtonAvailability();
      e.target.value = '';
    }
  });
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  if(isSaving) return; // voorkomt dubbel opslaan bij snel dubbeltikken
  if(processingPhotoCount > 0){
    toast('Even geduld, foto wordt nog verwerkt…');
    return;
  }

  const referentie = document.getElementById('fRef').value.trim();
  const omschrijving = document.getElementById('fOmschr').value.trim();
  const merk = document.getElementById('fMerk').value.trim();
  const materiaalTekst = document.getElementById('materiaalText').value.trim();

  if(!referentie && !labelPhoto){
    toast('Vul minstens een referentie of foto in');
    return;
  }

  // vangnet: waarschuw als deze referentie al bij het vorige artikel hoort
  // (bv. door een dubbele tik of per ongeluk twee keer opslaan)
  if(!editingItem && referentie && items.length){
    const lastItem = items.reduce((a,b) => (b.volgnummer > a.volgnummer ? b : a), items[0]);
    if(lastItem.referentie && lastItem.referentie === referentie){
      const proceed = await customConfirm(`Referentie "${referentie}" staat al bij artikel ${String(lastItem.volgnummer).padStart(3,'0')}. Toch als nieuw artikel opslaan?`);
      if(!proceed) return;
    }
  }

  isSaving = true;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.style.pointerEvents = 'none'; btn.textContent = 'Opslaan…';

  if(editingItem){
    const updatePayload = { referentie, omschrijving, merk, foto_label: labelPhoto, foto_artikel: artikelPhoto, foto_materiaal: JSON.stringify(materiaalPhotos.filter(Boolean)), materiaal_tekst: materiaalTekst };
    const { data, error } = await sb.from(TABLE).update(updatePayload).eq('id', editingItem.id).select();
    isSaving = false;
    btn.disabled = false; btn.style.pointerEvents = ''; btn.textContent = 'Wijzigingen opslaan';

    if(error){ console.error(error); toast('Opslaan mislukt: ' + (error.message || error.hint || JSON.stringify(error))); return; }

    items = items.map(i => i.id === editingItem.id ? data[0] : i);
    editingItem = null;
    render();
    document.getElementById('newSheetBackdrop').classList.remove('open');
    toast('Wijzigingen opgeslagen');
    return;
  }

  const payload = {
    session_id: currentSession,
    volgnummer: nextVolgnummer(),
    referentie, omschrijving, merk,
    foto_label: labelPhoto,
    foto_artikel: artikelPhoto,
    foto_materiaal: JSON.stringify(materiaalPhotos.filter(Boolean)),
    materiaal_tekst: materiaalTekst
  };

  const { data, error } = await sb.from(TABLE).insert(payload).select();
  isSaving = false;
  btn.disabled = false; btn.style.pointerEvents = ''; btn.textContent = 'Opslaan & volgende';

  if(error){ console.error(error); toast('Opslaan mislukt: ' + (error.message || error.hint || JSON.stringify(error))); return; }

  items.push(data[0]);
  render();
  toast(`Artikel ${String(payload.volgnummer).padStart(3,'0')} opgeslagen`);

  // reset for next capture, keep sheet open for fast successive shooting
  labelPhoto = null; artikelPhoto = null; materiaalPhotos = [null, null];
  document.getElementById('labelSlot').innerHTML = `<div class="cam-icon">🏷️</div><div class="cam-label">Label</div>`;
  document.getElementById('labelSlot').classList.remove('filled');
  document.getElementById('artikelSlot').innerHTML = `<div class="cam-icon">👕</div><div class="cam-label">Artikel</div>`;
  document.getElementById('artikelSlot').classList.remove('filled');
  [0,1].forEach(idx=>{
    const slot = document.getElementById(`materiaalSlot${idx}`);
    slot.innerHTML = `<div class="cam-icon">🧵</div>`;
    slot.classList.remove('filled');
  });
  document.getElementById('fRef').value = '';
  document.getElementById('fOmschr').value = '';
  document.getElementById('fMerk').value = '';
  document.getElementById('materiaalText').value = '';
  document.getElementById('newVolgnummer').textContent = `VOLGNR. ${String(nextVolgnummer()).padStart(3,'0')}`;
  document.getElementById('fRef').focus();
});

/* ---------- PDF export ---------- */
async function exportToPDF(){
  if(items.length === 0){ toast('Geen artikelen om te exporteren'); return; }
  toast('PDF wordt gemaakt…');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const pageW = 210, pageH = 297, margin = 15;
  const usableW = pageW - margin*2;
  let y = margin;

  // Titel: "Sessie — datum" (geen dubbele datum meer)
  const sessionDates = items.map(i => new Date(i.created_at)).filter(d => !isNaN(d));
  const sessionDate = sessionDates.length
    ? new Date(Math.min(...sessionDates)).toLocaleDateString('nl-BE')
    : new Date().toLocaleDateString('nl-BE');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text(`Sessie — ${sessionDate}`, margin, y);
  y += 6;
  doc.setDrawColor(200);
  doc.line(margin, y, pageW - margin, y);
  y += 8;

  function ensureSpace(needed){
    if(y + needed > pageH - margin){
      doc.addPage();
      y = margin;
    }
  }

  const sorted = [...items].sort((a,b) => a.volgnummer - b.volgnummer);

  for(const it of sorted){
    const matPhotosArr = parseMaterialPhotos(it.foto_materiaal).filter(Boolean);
    const matLine = it.materiaal_tekst ? it.materiaal_tekst.trim() : '';

    // alle foto's (label, artikel, materiaal x2) samen op 1 rij
    const photoSlots = [
      { src: it.foto_label, label: it.referentie || '—' },
      { src: it.foto_artikel, label: 'ARTIKEL' }
    ];
    matPhotosArr.forEach((p, i) => photoSlots.push({ src: p, label: matPhotosArr.length > 1 ? `MATERIAAL ${i+1}` : 'MATERIAAL' }));

    const gap = 3;
    let photoSize = Math.min(26, (usableW - (photoSlots.length - 1) * gap) / photoSlots.length);
    const rowStartX = margin; // links uitgelijnd

    const matTextLines = matLine ? doc.splitTextToSize(matLine, usableW).slice(0, 3) : [];

    // omschrijving + merk komen op dezelfde regel als het volgnummer
    const badgeW = 13, badgeH = 5, badgeGap = 3;
    const topTextX = margin + badgeW + badgeGap;
    const topTextW = usableW - badgeW - badgeGap;
    let topLabel = it.omschrijving || '';
    if(it.merk) topLabel = topLabel ? `${topLabel} — ${it.merk.toUpperCase()}` : it.merk.toUpperCase();
    const topLines = topLabel ? doc.splitTextToSize(topLabel, topTextW).slice(0, 1) : [];
    const topBlockH = Math.max(badgeH, topLines.length * 3.8);

    const photosBlockH = photoSize + 3.5;
    const matTextBlockH = matTextLines.length ? (matTextLines.length * 2.9 + 2.5) : 0;

    ensureSpace(topBlockH + 2 + photosBlockH + matTextBlockH + 4);
    const itemTop = y;

    // klein, subtiel volgnummer-label
    doc.setFillColor(60,58,55);
    doc.roundedRect(margin, itemTop, badgeW, badgeH, 1, 1, 'F');
    doc.setTextColor(255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(6.5);
    doc.text(`NR. ${String(it.volgnummer).padStart(3,'0')}`, margin + badgeW/2, itemTop + 3.5, {align:'center'});
    doc.setTextColor(20);

    if(topLines.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(topLines, topTextX, itemTop + 3.7);
    }

    const photosTop = itemTop + topBlockH + 2;
    let px = rowStartX;
    photoSlots.forEach(slot => {
      try{
        if(slot.src){
          doc.addImage(slot.src, 'JPEG', px, photosTop, photoSize, photoSize);
        } else {
          doc.setDrawColor(210); doc.rect(px, photosTop, photoSize, photoSize);
        }
      }catch(e){ doc.setDrawColor(210); doc.rect(px, photosTop, photoSize, photoSize); }
      doc.setFont('helvetica','normal'); doc.setFontSize(5.5); doc.setTextColor(140);
      doc.text(slot.label, px + photoSize/2, photosTop + photoSize + 3, {align:'center'});
      doc.setTextColor(20);
      px += photoSize + gap;
    });

    let ty = photosTop + photoSize + 5.5;

    if(matTextLines.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
      doc.setTextColor(90);
      doc.text(matTextLines, margin, ty);
      doc.setTextColor(20);
      ty += matTextLines.length * 2.9;
    }

    y = ty + 2.5;
    doc.setDrawColor(230);
    doc.line(margin, y-1.5, pageW-margin, y-1.5);
    y += 1.5;
  }

  doc.save(`packshot-${currentSession.replace(/[^a-z0-9]/gi,'_')}.pdf`);
  toast('PDF gedownload');
}

document.getElementById('exportPdfBtn').addEventListener('click', exportToPDF);

/* ---------- session sheet ---------- */
document.getElementById('switchSessionBtn').addEventListener('click', ()=>{
  document.getElementById('newSessionInput').value = '';
  loadSessionList();
  document.getElementById('sessionSheetBackdrop').classList.add('open');
});
document.getElementById('closeSessionBtn').addEventListener('click', ()=>{
  document.getElementById('sessionSheetBackdrop').classList.remove('open');
});
document.getElementById('startSessionBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('newSessionInput').value.trim();
  if(!name){
    toast('Geef eerst een titel voor de sessie');
    return;
  }
  const btn = document.getElementById('startSessionBtn');
  btn.disabled = true;
  await ensureSessionRecord(name);
  btn.disabled = false;
  setSession(name);
  document.getElementById('sessionSheetBackdrop').classList.remove('open');
});

/* close sheets on backdrop tap */
[['newSheetBackdrop'], ['sessionSheetBackdrop']].forEach(([id])=>{
  document.getElementById(id).addEventListener('click', (e)=>{
    if(e.target.id === id) document.getElementById(id).classList.remove('open');
  });
});

/* ---------- realtime sync (telefoon ↔ computer) ---------- */
let realtimeChannel = null;

function subscribeRealtime(){
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb
    .channel('packshot-items-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, handleRealtimeChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'packshot_sessions' }, ()=> renderSessionTabs())
    .subscribe();
}

function handleRealtimeChange(payload){
  const { eventType, new: newRow, old: oldRow } = payload;

  // sessiebalk altijd verversen (nieuwe sessie of aangepast aantal artikelen)
  renderSessionTabs();

  const affectedSession = (newRow && newRow.session_id) || (oldRow && oldRow.session_id);
  if(affectedSession !== currentSession) return;

  if(eventType === 'INSERT'){
    if(!items.some(i => i.id === newRow.id)){
      items.push(newRow);
      items.sort((a,b)=> a.volgnummer - b.volgnummer);
      render();
    }
  } else if(eventType === 'UPDATE'){
    const idx = items.findIndex(i => i.id === newRow.id);
    if(idx > -1){
      items[idx] = newRow;
      render();
    }
  } else if(eventType === 'DELETE'){
    if(items.some(i => i.id === oldRow.id)){
      items = items.filter(i => i.id !== oldRow.id);
      render();
    }
  }
}

/* ---------- init ---------- */
document.getElementById('sessionName').textContent = displaySessionName(currentSession);
loadItems();
subscribeRealtime();
</script>
